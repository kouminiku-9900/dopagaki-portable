# PSP connects directly to YouTube over Wi-Fi. There is no companion server.
url=https://m.youtube.com/
trace=none
profile=realistic
# Wi-Fi is chosen in the PSP system connection dialog at startup.
# network_profile is only used to reconnect after sleep if the name lookup fails.
network_profile=1
limit_mb=32
file_kb=384
ticks=0
dump_frame=0
